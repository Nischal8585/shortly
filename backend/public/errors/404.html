<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Not Found - Shortly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'IBM Plex Sans', sans-serif;
      --color-bg: #faf8f5;
      --color-surface: #ffffff;
      --color-text-primary: #1a1917;
      --color-text-secondary: #5c5a56;
      --color-accent: #c84b31;
      --color-border: #e6e3de;
      --border-radius: 4px;
      --spacing-xs: 0.5rem;
      --spacing-sm: 0.75rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
    }

    .container {
      max-width: 500px;
      text-align: center;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-xl);
      letter-spacing: -0.02em;
    }

    .error-code {
      font-family: var(--font-display);
      font-size: 6rem;
      font-weight: 700;
      color: var(--color-accent);
      line-height: 1;
      margin-bottom: var(--spacing-md);
      letter-spacing: -0.03em;
    }

    .error-title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-md);
      letter-spacing: -0.02em;
    }

    .error-message {
      font-size: 1rem;
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: var(--spacing-xl);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 var(--spacing-lg);
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      border: 1px solid transparent;
      text-decoration: none;
      width: 100%;
      max-width: 280px;
    }

    .btn-primary {
      background-color: var(--color-accent);
      color: #ffffff;
      border-color: var(--color-accent);
    }

    .btn-primary:hover {
      background-color: #b03d28;
      border-color: #b03d28;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--color-text-primary);
      border-color: var(--color-border);
    }

    .btn-secondary:hover {
      border-color: var(--color-text-primary);
      background-color: transparent;
    }

    @media (min-width: 600px) {
      .actions {
        flex-direction: row;
        justify-content: center;
      }

      .btn {
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Shortly</div>
    <div class="error-code">404</div>
    <h1 class="error-title">This short link doesn't exist.</h1>
    <p class="error-message">
      It may have expired, been deleted, or never existed.
    </p>
    <div class="actions">
      <a href="http://localhost:5173/" class="btn btn-primary" id="home-link">
        Go Home
      </a>
      <a href="http://localhost:5173/dashboard" class="btn btn-secondary" id="dashboard-link">
        Create Your Own Short Link
      </a>
    </div>
    <script>
      // Fetch CLIENT_URL from backend config endpoint to override for production
      fetch('/config')
        .then(res => res.json())
        .then(config => {
          const baseUrl = config.CLIENT_URL;
          document.getElementById('home-link').href = baseUrl + '/';
          document.getElementById('dashboard-link').href = baseUrl + '/dashboard';
        })
        .catch(() => {
          // Fallback: buttons use development URLs if config fetch fails
          console.error('Failed to fetch CLIENT_URL from /config endpoint');
        });
    </script>
  </div>
</body>
</html>
